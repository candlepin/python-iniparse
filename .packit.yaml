# See the documentation for more information:
# https://packit.dev/docs/configuration/

specfile_path: python-iniparse.spec

# add or remove files that should be synced
files_to_sync:
    - python-iniparse.spec
    - .packit.yaml

# URL of upstream project
upstream_project_url: https://github.com/candlepin/python-iniparse
# name in upstream package repository/registry (e.g. in PyPI)
upstream_package_name: python-iniparse
# downstream (Fedora) RPM package name
downstream_package_name: python-iniparse

# Default is the latest git tag (still 0.5.1). Read setup.py so PR builds of a
# version bump match the egg-info directory Packit installs.
actions:
  get-current-version:
    - python3 -c "import re; print(re.search(r'^VERSION = \"(.+)\"', open('setup.py').read(), re.M).group(1))"

jobs:
- job: copr_build
  trigger: pull_request
  metadata:
    targets:
    - fedora-all
- job: tests
  trigger: pull_request
  metadata:
    targets:
      - fedora-all